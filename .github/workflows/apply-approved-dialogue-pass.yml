name: Apply approved dialogue pass

on:
  push:
    branches:
      - translation/punchier-opening-20260901

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Add one-shot workflow for approved dialogue pass'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: translation/punchier-opening-20260901
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project and development checks
        run: python -m pip install -e '.[dev]'

      - name: Apply approved record edits
        shell: python
        run: |
          import json
          from pathlib import Path

          c_path = Path('work/clean_rebuild/sources/PART1C.json')
          d_path = Path('work/clean_rebuild/sources/PART1D.json')

          edits = [
              (
                  149,
                  115,
                  "I saw it...a starboard first-class cabin...something was thrown from its window just before the blast...now I understand...",
                  "I saw it...one of the first-class cabins on the starboard side...something was thrown from the window just before the blast...now I understand...",
              ),
              (
                  163,
                  129,
                  "Quite possible, if the explosive was SBC. It can generate that much heat.",
                  "That's possible. If the bomb used SBC, it could generate that much heat.",
              ),
              (
                  165,
                  131,
                  "Shimose Basic Cracker. An incendiary shell explosive that annihilated Russia's Baltic Fleet in the Sea of Japan two years ago. It uses the heat reaction produced when picric acid contacts metal, scattering temperatures above 2,000 degrees when it explodes. Even steel melts like taffy. No one on deck could survive.",
                  "Shimose Basic Cracker. An incendiary explosive used in shells that annihilated Russia's Baltic Fleet in the Sea of Japan two years ago. It exploits the heat reaction produced when picric acid comes into contact with metal. On detonation, it releases heat exceeding 2,000 degrees in every direction. Even steel melts like taffy. No one on deck could survive.",
              ),
              (
                  176,
                  142,
                  "You are not saying I am definitely the culprit. That is what you mean, right?",
                  "You're not saying I'm definitely the culprit. That's what you mean, right?",
              ),
              (
                  185,
                  151,
                  "Exactly. If I were the culprit, I would have boarded under an alias, forged my passport, and posed as a subject of Qing China or another country. Otherwise I would be a complete fool. Would someone capable of setting bombs with precise time fuses leave such an obvious trail? It was not me.",
                  "Exactly. If I were the culprit, I'd have boarded under an alias, forged my passport, and posed as a subject of Qing China or some other country. Otherwise I'd be a complete fool. Would someone capable of setting bombs with precise time fuses leave such an obvious trail? It wasn't me.",
              ),
              (
                  189,
                  155,
                  "He feels no pressure...wrong man, detective.",
                  "He doesn't seem nervous...you've got the wrong man, detective.",
              ),
              (
                  192,
                  158,
                  "If I catch the culprit myself, you will stop glaring at me like that, right?",
                  "If I catch the culprit myself, you'll stop glaring at me like that, right?",
              ),
              (
                  200,
                  166,
                  "True, I did not buy Yuko a souvenir. But does that deserve this much bad luck? Seriously?",
                  "True, I didn't buy Yuko a souvenir. But does that deserve this much bad luck? Seriously?",
              ),
              (
                  202,
                  168,
                  "He would go that far?",
                  "He'd go that far?",
              ),
              (
                  203,
                  169,
                  "What is your record for catching culprits?",
                  "What's your success rate at catching culprits?",
              ),
              (
                  205,
                  171,
                  "I thought so. That is bad news for me.",
                  "I thought so. That's bad news for me.",
              ),
              (
                  206,
                  172,
                  "Maybe it is not too late. I should buy Yuko a souvenir from the ship's shop.",
                  "Maybe it's not too late to buy Yuko a souvenir from the ship's shop.",
              ),
          ]

          def load(path):
              return json.loads(path.read_text(encoding='utf-8'))

          c_data = load(c_path)
          d_data = load(d_path)
          assert c_data['chapter'] == 'PART1C'
          assert d_data['chapter'] == 'PART1D'

          changed = []
          for c_index, d_index, old, new in edits:
              for data, chapter, index in (
                  (c_data, 'PART1C', c_index),
                  (d_data, 'PART1D', d_index),
              ):
                  record = data['records'][index]
                  assert record['index'] == index, (chapter, index, record['index'])
                  actual = record['text']
                  assert actual == old, (
                      f'{chapter}:{index:03d} changed unexpectedly before approved edit',
                      actual,
                      old,
                  )
                  record['text'] = new
                  changed.append(f'{chapter}:{index:03d}')

          c_path.write_text(
              json.dumps(c_data, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
              newline='\n',
          )
          d_path.write_text(
              json.dumps(d_data, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
              newline='\n',
          )
          assert len(changed) == 24
          print('Applied:', ', '.join(changed))

      - name: Remove one-shot workflow and refresh manifest
        run: |
          git rm .github/workflows/apply-approved-dialogue-pass.yml
          python tools/source_manifest.py --root . --write

      - name: Validate final tree before commit
        run: |
          git diff --check
          python tools/source_health.py --root . --strict-release
          python tools/source_manifest.py --root .
          python -m compileall -q nostalgia1907.py tools tests work
          python -m unittest discover -s tests -v
          python -m ruff check nostalgia1907.py tools tests work
          python tools/style_audit.py --root .

      - name: Commit approved dialogue pass
        run: |
          git config user.name 'starlight_world'
          git config user.email '43389528+matt-dawidowicz@users.noreply.github.com'
          git add work/clean_rebuild/sources/PART1C.json work/clean_rebuild/sources/PART1D.json MANIFEST.sha256
          git diff --cached --check
          git commit -m 'Polish infirmary and accusation dialogue'
          git push origin HEAD:translation/punchier-opening-20260901
