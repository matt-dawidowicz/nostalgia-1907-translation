name: Apply audited source corrections 20260827

on:
  push:
    branches:
      - translation-source-corrections-20260827
    paths:
      - .github/workflows/apply-audited-source-corrections-20260827.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: translation-source-corrections-20260827
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply all audited source corrections
        run: python tools/apply_audited_source_corrections_20260827.py
      - name: Verify correction result
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('work/reviewed_changes/source_corrections_applied_20260827.json').read_text(encoding='utf-8'))
          assert report['status'] == 'PASS'
          assert report['changed_record_count'] == 345
          changed = {row['id'] for row in report['changed_records']}
          required = {
              'PART2D:111', 'PART2E:128', 'PART2E:137', 'PART2E:138',
              'PART2E:139', 'PART2E:140', 'PART3C:211', 'PART4B:260',
              'PART4B:271', 'PART4C:037', 'PART4C:049'
          }
          assert required <= changed
          print('PASS: 345 audited canonical records changed')
          PY
      - name: Commit canonical source corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add work/clean_rebuild/sources work/reviewed_changes/source_corrections_applied_20260827.json
          test -n "$(git diff --cached --name-only)"
          git commit -m 'translation: apply audited Japanese source corrections'
          git push origin HEAD:translation-source-corrections-20260827

# Retrigger after verified payload transport and heading-lock repairs.
