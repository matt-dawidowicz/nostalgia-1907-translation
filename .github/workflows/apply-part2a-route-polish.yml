name: Apply PART2A route polish

on:
  push:
    branches:
      - translation/punchier-opening-20260901
    paths:
      - .github/workflows/apply-part2a-route-polish.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: translation/punchier-opening-20260901
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development checks
        run: python -m pip install -e ".[dev]"

      - name: Apply approved PART2A edits
        shell: bash
        run: |
          git rm .github/workflows/apply-part2a-route-polish.yml
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("work/clean_rebuild/sources/PART2A.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          records = {r["index"]: r for r in data["records"]}
          changes = {
              94: (
                  "Follow this passage to second class. Cabins C and D are on the right. The shop is ahead.",
                  "This passage leads to second class. Cabins C and D are on the right. The shop is straight ahead.",
              ),
              102: (
                  "The culprit did not come through the passage toward second class. I should turn around and head forward.",
                  "The culprit didn't come this way toward second class. I'll turn around and head forward.",
              ),
              103: (
                  "Back in the first-class block. The forward passage runs past the game hall, bar, and galley, with Center Hall at the end.",
                  "Back in the first-class block. The forward passage runs past the game hall, bar, and galley, ending at Center Hall.",
              ),
              108: (
                  "Slaving for the man in the chair.",
                  "Slaving away for the man in the chair.",
              ),
              113: (
                  "That's good to hear. Thanks.",
                  "Glad to hear it. Thanks.",
              ),
              116: (
                  "It was dead quiet. The Russian customer was gloomy. No one else came in. Something was happening at the game hall.",
                  "It was dead quiet. The Russian customer was gloomy. No one else came in. Something was going on in the game hall.",
              ),
          }
          for index, (old, new) in changes.items():
              actual = records[index]["text"]
              if actual != old:
                  raise SystemExit(f"PART2A:{index:03d} assertion failed: {actual!r} != {old!r}")
              records[index]["text"] = new
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8", newline="\n")
          print(f"Applied {len(changes)} approved PART2A edits")
          PY
          python tools/source_manifest.py --root . --write

      - name: Validate source tree
        shell: bash
        run: |
          python tools/source_health.py --root . --strict-release
          python tools/source_manifest.py --root .
          python -m compileall -q nostalgia1907.py tools tests work
          python -m unittest discover -s tests -v
          python -m ruff check nostalgia1907.py tools tests work
          python tools/style_audit.py --root .

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "starlight_world"
          git config user.email "43389528+matt-dawidowicz@users.noreply.github.com"
          git add work/clean_rebuild/sources/PART2A.json MANIFEST.sha256 .github/workflows/apply-part2a-route-polish.yml
          git diff --cached --check
          git commit -m "Polish Action 2 route investigation dialogue"
          git push origin HEAD:translation/punchier-opening-20260901
