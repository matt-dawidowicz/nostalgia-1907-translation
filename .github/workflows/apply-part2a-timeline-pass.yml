name: Apply Action 2 timeline polish

on:
  push:
    branches:
      - translation/punchier-opening-20260901

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: translation/punchier-opening-20260901
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install project and development checks
        run: python -m pip install -e ".[dev]"

      - name: Apply approved PART2A timeline polish
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('work/clean_rebuild/sources/PART2A.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          edits = {
              68: (
                  "About what time did you discover the threat written in rouge on your cabin window?",
                  "About what time did you find the threat written in rouge on your cabin window?",
              ),
              71: (
                  "Fifteen minutes since it aired...which means...",
                  "Fifteen minutes after the broadcast...which means...",
              ),
              77: (
                  "Then came the lifeboat and engine-room explosions...during them, the culprit entered the captain's cabin and wrote the threat. Several routes are possible.",
                  "Then the lifeboat and engine-room explosions went off...during the chaos, the culprit entered the captain's cabin and wrote the threat. Several routes are possible.",
              ),
              78: (
                  "First class to the captain's cabin. Good. I can retrace it.",
                  "From first class to the captain's cabin. Good. I can retrace the route.",
              ),
              83: (
                  "Everyone aboard. Use the shipwide broadcast and have them wait where they were at 11:00 a.m.",
                  "Use the shipwide broadcast. Have everyone aboard return to where they were at 11:00 a.m. and wait there.",
              ),
              89: (
                  "The culprit wants 'The Russian Fog.' Phrase it as something connected to that. I'm taking the map. Please make the announcement.",
                  "The culprit wants 'The Russian Fog.' Tie the announcement to that somehow. I'm taking the map. Please make the announcement.",
              ),
          }

          changed = 0
          for index, (expected, replacement) in edits.items():
              record = data['records'][index]
              assert record['index'] == index, (index, record['index'])
              actual = record['text']
              assert actual == expected, f'PART2A:{index:03d} expected {expected!r}, got {actual!r}'
              record['text'] = replacement
              changed += 1

          assert changed == 6, changed
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8', newline='\n')
          print(f'Applied {changed} PART2A timeline edits')
          PY

      - name: Remove one-shot workflow and refresh manifest
        shell: bash
        run: |
          git rm .github/workflows/apply-part2a-timeline-pass.yml
          python tools/source_manifest.py --root . --write
          git add work/clean_rebuild/sources/PART2A.json MANIFEST.sha256

      - name: Run source validation
        shell: bash
        run: |
          python tools/source_health.py --root . --strict-release
          python tools/source_manifest.py --root .
          python -m compileall -q nostalgia1907.py tools tests work
          python -m unittest discover -s tests -v
          python -m ruff check nostalgia1907.py tools tests work
          python tools/style_audit.py --root .

      - name: Commit polished source
        shell: bash
        run: |
          git config user.name "matt-dawidowicz"
          git config user.email "43389528+matt-dawidowicz@users.noreply.github.com"
          git commit -m "Polish Action 2 timeline reconstruction dialogue"
          git push origin HEAD:translation/punchier-opening-20260901
