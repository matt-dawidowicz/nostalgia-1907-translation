name: Apply PART2C naturalization

on:
  push:
    branches:
      - translation/punchier-opening-20260901
    paths:
      - .github/workflows/apply-part2c-naturalization.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: translation/punchier-opening-20260901
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development checks
        run: python -m pip install -e ".[dev]"

      - name: Apply approved PART2C edits
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("work/clean_rebuild/sources/PART2C.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          edits = {
              5: (
                  "I would hardly call it a good start...may I ask you a few questions?",
                  "I wouldn't exactly say it's off to a good start...may I ask you a few questions?",
              ),
              10: (
                  "Weathered...a self-made, hands-on captain.",
                  "Weathered...a hands-on captain who came up through the ranks.",
              ),
              20: (
                  "Shimose explosives burned Russian battleships like paper. However sturdy she is, this is still a passenger ship.",
                  "Shimose explosives burned Russian battleships like paper. No matter how sturdy she is, this is still a passenger ship.",
              ),
              29: (
                  "It was just a prelude. Sometimes it helps to pursue something seemingly unrelated before getting to the point.",
                  "Just a prelude. Sometimes it helps to start with something seemingly unrelated before getting to the point.",
              ),
              35: (
                  "There is so much here that interests me...",
                  "There's so much here I'm curious about...",
              ),
              36: (
                  "A sturdy ship draws insurers. Every offer carried unusually favorable terms.",
                  "A sturdy ship attracts insurers. Every offer came with unusually favorable terms.",
              ),
              51: (
                  "Then say anything!",
                  "Then say something!",
              ),
              52: (
                  "Think about the captain's nature...",
                  "Think about what kind of man the captain is...",
              ),
              54: (
                  "Wrong. Safety, and its image. Safety, certainty, lives first. People trust Trans-Atlantic ships never to have accidents.",
                  "Wrong. Safety, and a reputation for it. Safety, certainty, human lives first. People trust Trans-Atlantic ships because they don't have accidents.",
              ),
              58: (
                  "A poor start...damn. This is what happens when I act on a theory I don't believe.",
                  "Bad start...damn. That's what I get for pursuing a theory I don't believe myself.",
              ),
              94: (
                  "What I look at is my own business.",
                  "What I look at is none of your business.",
              ),
              132: (
                  "Maybe I am crazy...that is strange.",
                  "Maybe I am crazy...but that is strange.",
              ),
              166: (
                  "Paris's narrow-minded crowd all sneer, but I appreciate it. Everything from there is beautiful. The Russian Fog is the pinnacle...I see. So it is aboard this ship...",
                  "The narrow-minded crowd in Paris sneers at it, but I appreciate it. Everything from there is beautiful. The Russian Fog is the pinnacle...I see. So it's aboard this ship...",
              ),
              167: (
                  "The culprit thinks so...so it was a jewel...",
                  "The culprit thinks so...so the Russian Fog is a jewel...",
              ),
          }

          records = {record["index"]: record for record in data["records"]}
          for index, (old, new) in edits.items():
              actual = records[index]["text"]
              if actual != old:
                  raise SystemExit(
                      f"PART2C:{index:03d} assertion failed\nexpected: {old!r}\nactual:   {actual!r}"
                  )
              records[index]["text"] = new

          path.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"Applied {len(edits)} PART2C edits")
          PY

      - name: Validate source tree
        shell: bash
        run: |
          git rm .github/workflows/apply-part2c-naturalization.yml
          python tools/source_manifest.py --root . --write
          python tools/source_health.py --root . --strict-release
          python tools/source_manifest.py --root .
          python -m compileall -q nostalgia1907.py tools tests work
          python -m unittest discover -s tests -v
          python -m ruff check nostalgia1907.py tools tests work
          python tools/style_audit.py --root .

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work/clean_rebuild/sources/PART2C.json MANIFEST.sha256
          git diff --cached --check
          git commit -m "Polish PART2C investigation dialogue"
          git push origin HEAD:translation/punchier-opening-20260901
