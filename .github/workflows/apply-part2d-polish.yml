name: Apply PART2D polish

on:
  push:
    paths:
      - .github/workflows/apply-part2d-polish.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: translation/punchier-opening-20260901

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development checks
        run: python -m pip install -e ".[dev]"

      - name: Apply approved PART2D edits
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("work/clean_rebuild/sources/PART2D.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          records = {row["index"]: row for row in data["records"]}
          edits = {
              13: (
                  "The Anglo-Japanese Alliance...an alliance with an overwhelming imbalance of power, though.",
                  "The Anglo-Japanese Alliance...though the balance of power is overwhelmingly unequal.",
              ),
              19: (
                  "How's the culprit investigation going?",
                  "How's the search for the culprit going?",
              ),
              28: (
                  "Like hell! Don't sit back and say whatever you please!",
                  "Like hell! You don't get to sit back and say whatever you please!",
              ),
              47: (
                  "Your trainer must have been lamentable. You still have not learned the proper relation between master and servant.",
                  "Your trainer must have been dreadful. You still have not learned the proper relation between master and servant.",
              ),
              71: (
                  "With him...if getting what he wanted required murder, I think he might even kill.",
                  "With him...if he had to kill someone to get what he wanted, I think he would.",
              ),
              76: (
                  "Paris doesn't leave a beautiful woman alone. Surely someone like you had any number of more worthwhile jobs?",
                  "Paris doesn't leave a beautiful woman alone. Surely someone like you could have found any number of more worthwhile jobs?",
              ),
              84: (
                  "You can really stand talking to Braque. I would snap in ten seconds.",
                  "You can actually stand talking to Braque. I'd snap in ten seconds.",
              ),
              89: (
                  "Thank you. You have told me quite a lot.",
                  "Thanks. You've told me a lot.",
              ),
              102: (
                  "Braque bought my talent and offered to be my patron. He has a weakness for young women who paint...",
                  "Braque recognized my talent and offered to be my patron. He has a weakness for young women who paint...",
              ),
              112: (
                  "I see...second class really is the way to travel. You make companions. I'm jealous. You'd better warn her: Braque isn't interested in her artistic talent, but in her legs.",
                  "I see...second class really is the way to travel. You meet people. I'm jealous. You'd better warn her: Braque isn't interested in her artistic talent, but in her legs.",
              ),
              123: (
                  "No...so you do work after all. Sorry. I apologize for laughing.",
                  "No...so you do work after all. Sorry I laughed.",
              ),
          }

          for index, (old, new) in edits.items():
              actual = records[index]["text"]
              if actual != old:
                  raise SystemExit(
                      f"PART2D:{index:03d} assertion failed\nexpected: {old!r}\nactual:   {actual!r}"
                  )
              records[index]["text"] = new

          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"Applied {len(edits)} approved PART2D edits.")
          PY

      - name: Remove one-shot workflow and refresh manifest
        shell: bash
        run: |
          git rm .github/workflows/apply-part2d-polish.yml
          python tools/source_manifest.py --root . --write

      - name: Validate source tree
        shell: bash
        run: |
          python tools/source_health.py --root . --strict-release
          python tools/source_manifest.py --root .
          python -m compileall -q nostalgia1907.py tools tests work
          python -m unittest discover -s tests -v
          python -m ruff check nostalgia1907.py tools tests work
          python tools/style_audit.py --root .

      - name: Commit approved changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work/clean_rebuild/sources/PART2D.json MANIFEST.sha256
          git commit -m "Polish PART2D dialogue naturalization"
          git push origin HEAD:translation/punchier-opening-20260901
