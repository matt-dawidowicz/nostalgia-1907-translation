name: Apply PART3A polish

on:
  push:
    branches:
      - translation/punchier-opening-20260901
    paths:
      - .github/workflows/apply-part3a-polish.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: translation/punchier-opening-20260901
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install project and development checks
        run: python -m pip install -e ".[dev]"

      - name: Apply approved PART3A edits
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('work/clean_rebuild/sources/PART3A.json')
          data = json.loads(path.read_text(encoding='utf-8'))

          replacements = {
              42: (
                  'Get angrier. Do not think calmly.',
                  "Get angrier. Don't think straight.",
              ),
              60: (
                  "Idiot! No ordinary carpenter would ask that. You're a Russian spy!",
                  "Idiot! No honest carpenter would ask that. You're a Russian spy!",
              ),
              77: (
                  'Stubborn fool. You just will not let go...',
                  "Stubborn fool. You just won't let it go...",
              ),
              98: (
                  'Something just does not click...',
                  "Something just doesn't click...",
              ),
              108: (
                  'You could not compose in Russia, could you?',
                  "You couldn't compose in Russia, could you?",
              ),
              111: (
                  'You said yourself that you are fleeing Russia.',
                  "You said yourself you're fleeing Russia.",
              ),
              159: (
                  "But I'm not much good at deciding things like that...",
                  "But I'm not much good at judging things like that...",
              ),
              180: (
                  "I have recited it since the last Maharaja's day!",
                  "I've been reciting it since the previous Maharaja's time!",
              ),
              186: (
                  'I cannot listen to any more of this.',
                  "I can't listen to any more of this.",
              ),
              193: (
                  "A maharaja's daughter from a British Indian protectorate, and her chaperone. Time to narrow the targets: Ashby or Ruthie.",
                  "A maharaja's daughter from a British Indian protectorate, and her chaperone. Time to narrow down the targets: Ashby or Ruthie.",
              ),
              212: (
                  "...that's why you can kill him.",
                  '...that gave you reason to kill him.',
              ),
              220: (
                  'With enough passion to kill him?',
                  'Enough to kill him?',
              ),
              244: (
                  "I can't truly hate anyone. I don't know what I should do or what I ever really wanted. When you never find it, you become vague. I found nothing in the city...",
                  "I can't truly hate anyone. I don't know what I should do or what I ever really wanted. If you never find it, you lose your sense of who you are. I found nothing in the city...",
              ),
              247: (
                  'Mediterranean colors...words that make me hate Paris.',
                  'Mediterranean colors...just hearing those words makes me hate Paris.',
              ),
          }

          records = {record['index']: record for record in data['records']}
          exact = data['profile']['required_text_exact']

          for index, (old, new) in replacements.items():
              assert records[index]['text'] == old, (
                  index,
                  'record',
                  records[index]['text'],
                  old,
              )
              assert exact[str(index)] == old, (
                  index,
                  'required_text_exact',
                  exact[str(index)],
                  old,
              )
              records[index]['text'] = new
              exact[str(index)] = new

          path.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(f'Applied {len(replacements)} approved PART3A edits to records and exact-text profile.')
          PY

      - name: Remove one-shot workflow and refresh manifest
        shell: bash
        run: |
          git rm .github/workflows/apply-part3a-polish.yml
          python tools/source_manifest.py --root . --write

      - name: Validate source tree
        shell: bash
        run: |
          python tools/source_health.py --root . --strict-release
          python tools/source_manifest.py --root .
          python -m compileall -q nostalgia1907.py tools tests work
          python -m unittest discover -s tests -v
          python -m ruff check nostalgia1907.py tools tests work
          python tools/style_audit.py --root .

      - name: Commit approved changes
        shell: bash
        run: |
          git config user.name "starlight_world"
          git config user.email "43389528+matt-dawidowicz@users.noreply.github.com"
          git add work/clean_rebuild/sources/PART3A.json MANIFEST.sha256
          git status --short
          git commit -m "Polish PART3A dialogue and Ruthie scene"
          git push origin HEAD:translation/punchier-opening-20260901
