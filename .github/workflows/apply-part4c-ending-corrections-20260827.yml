name: Apply PART4C ending corrections 20260827

on:
  push:
    branches:
      - translation-source-corrections-20260827
    paths:
      - .github/workflows/apply-part4c-ending-corrections-20260827.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: translation-source-corrections-20260827
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project tooling
        run: python -m pip install -e .
      - name: Apply exact-match ending corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          review = Path('work/reviewed_changes/part4c_ending_source_correction_20260827.json')
          payload = json.loads(review.read_text(encoding='utf-8'))
          changes = payload['changes']
          if len(changes) != 8:
              raise SystemExit(f'expected 8 ending corrections, got {len(changes)}')

          expected_ids = {
              'PART4C:049', 'PART4C:051', 'PART4C:052', 'PART4C:054',
              'PART4C:055', 'PART4C:056', 'PART4C:057', 'PART4C:059',
          }
          ids = {item['id'] for item in changes}
          if ids != expected_ids:
              raise SystemExit(f'unexpected correction IDs: {sorted(ids)}')

          source = Path('work/clean_rebuild/sources/PART4C.json')
          doc = json.loads(source.read_text(encoding='utf-8'))
          if doc.get('chapter') != 'PART4C':
              raise SystemExit('PART4C chapter metadata mismatch')
          records = {record['index']: record for record in doc['records']}
          if len(records) != len(doc['records']):
              raise SystemExit('PART4C contains duplicate record indexes')

          exact_locks = (doc.get('profile') or {}).get('required_text_exact', {})
          for item in sorted(changes, key=lambda row: row['id']):
              stable_id = item['id']
              index = int(stable_id.split(':', 1)[1])
              record = records.get(index)
              if record is None:
                  raise SystemExit(f'{stable_id}: missing canonical record')
              if record.get('policy') != 'translate':
                  raise SystemExit(f'{stable_id}: record is not translatable')
              current = record.get('text')
              if current != item['before']:
                  raise SystemExit(
                      f'{stable_id}: stale before-text; expected {item["before"]!r}, got {current!r}'
                  )
              if record.get('layout_policy') != item['layout_policy']:
                  raise SystemExit(
                      f'{stable_id}: layout policy changed from reviewed value '
                      f'{item["layout_policy"]!r} to {record.get("layout_policy")!r}'
                  )
              record['text'] = item['after']
              key = str(index)
              if key in exact_locks:
                  if exact_locks[key] != item['before']:
                      raise SystemExit(
                          f'{stable_id}: profile lock mismatch; expected {item["before"]!r}, '
                          f'got {exact_locks[key]!r}'
                      )
                  exact_locks[key] = item['after']

          # Verify the exact fixed-layout strings and their reviewed static cell counts.
          static = payload['static_cell_comparison']
          for stable_id, measurements in static.items():
              index = int(stable_id.split(':', 1)[1])
              text = records[index]['text']
              cells = (len(text) + 1) // 2
              expected_cells = measurements['after_cells']
              if cells != expected_cells:
                  raise SystemExit(
                      f'{stable_id}: expected {expected_cells} literal cells, got {cells}: {text!r}'
                  )

          unchanged = {item['id']: item['text'] for item in payload['unchanged_verified']}
          for stable_id, text in unchanged.items():
              index = int(stable_id.split(':', 1)[1])
              if records[index].get('text') != text:
                  raise SystemExit(f'{stable_id}: verified unchanged line drifted')

          temp = source.with_suffix(source.suffix + '.ending.tmp')
          temp.write_text(json.dumps(doc, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          json.loads(temp.read_text(encoding='utf-8'))
          os.replace(temp, source)

          # Exact post-application verification.
          final = json.loads(source.read_text(encoding='utf-8'))
          final_records = {record['index']: record for record in final['records']}
          for item in changes:
              index = int(item['id'].split(':', 1)[1])
              actual = final_records[index].get('text')
              if actual != item['after']:
                  raise SystemExit(f'{item["id"]}: post-application mismatch')
          print('PASS: all 8 PART4C ending corrections applied exactly')
          PY

          changed="$(git diff --name-only -- work/clean_rebuild/sources | sort)"
          if [ "$changed" != 'work/clean_rebuild/sources/PART4C.json' ]; then
            printf 'Unexpected canonical diff set:\n%s\n' "$changed"
            exit 1
          fi
          git diff --check
      - name: Validate source tree
        shell: bash
        run: |
          python tools/source_health.py --root . --strict-release
          python -m compileall -q nostalgia1907.py tools work tests
          python -m unittest discover -s tests -v
      - name: Commit canonical ending corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add work/clean_rebuild/sources/PART4C.json
          git commit -m 'translation: correct PART4C ending sequence'
          git push origin HEAD:translation-source-corrections-20260827
