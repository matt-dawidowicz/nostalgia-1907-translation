name: Apply remaining localization v2

on:
  push:
    paths:
      - '.github/workflows/apply-remaining-localization-v2-20260902.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: translation/punchier-opening-20260901
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify reviewed source blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object work/clean_rebuild/sources/PART3B.json)" = "4b1bfc9bc59be81adaed618fd40b1ad861aa2c82"
          test "$(git hash-object work/clean_rebuild/sources/PART3B_.json)" = "ce5a60d4a79ca4cefae2404cb7aa12eefce21087"
          test "$(git hash-object work/clean_rebuild/sources/PART3C.json)" = "3d93cb273c6bf665b985a08156f391c4984c640d"
          test "$(git hash-object work/clean_rebuild/sources/PART4A.json)" = "63821e01c786769d6fa4fba0c4df76b3ed5d85d6"
          test "$(git hash-object work/clean_rebuild/sources/PART4B.json)" = "4447211d3602ce877cebb086b861371f61f1d0ce"
          test "$(git hash-object work/clean_rebuild/sources/PART4C.json)" = "e37661df15caf2d9ab139f88357ec2ea8d99dceb"
          test "$(git hash-object work/clean_rebuild/sources/STAFF.json)" = "52243f19445c0b8c2b9fe9c6568510008d4daf0b"
      - name: Apply reviewed remaining translation changes
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('work/clean_rebuild/sources')
          edits = {
            'PART3B': {
              199: "The Deputy Chief died for the Fog.",
              202: "That's sophistry. Fine. If we make it safely to tomorrow morning, do as you please.",
            },
            'PART3B_': {
              3: "Laugh at me, Charlie. Even though I've got the target in my sights, I can't kill him... Don't be angry... I've been a coward since I was a kid. Give me a little more time...",
              8: "Sorry, but I don't want to see anyone right now.",
              10: "Now, Ruthie...it looks like I won't be returning to southern France...sorry.",
              11: "You're kind. You're wonderful.",
              13: "...that may be exactly what I need to hear right now...",
              36: "Sorry, later!",
              50: "Human reason isn't that strong. When desire coiled at the bottom of the heart tries to get out, it will deceive its way through the checkpoint called 'reason' before it emerges.",
              55: "Her conscious mind doesn't know it, but she unconsciously identified with the desire expressed in the picture.",
              57: "Her true feelings, which even she has not recognized, overflow from within her and take shape here...",
              69: "The shape of distorted desire...its symbols. The 'husband' is the symbol of her 'belief'; the 'king' is 'society' or 'authority.' Killing the king's 'daughter' is an expression of rebellion. Through it we can see her true feelings, feelings even she has not noticed. When impulse strikes and action leaps beyond reason, the true motive is laid bare.",
