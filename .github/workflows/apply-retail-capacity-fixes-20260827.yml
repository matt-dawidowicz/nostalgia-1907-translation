name: Apply retail-backed capacity fixes 20260827

on:
  push:
    branches:
      - translation-source-corrections-20260827
    paths:
      - .github/workflows/apply-retail-capacity-fixes-20260827.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: translation-source-corrections-20260827
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project tooling
        run: python -m pip install -e .
      - name: Apply exact-match retail capacity fixes
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          changes = {
              "PART2A": {
                  78: (
                      "From first class to the captain's cabin. Good. I can retrace the route.",
                      "First class to the captain's cabin. Good. I can retrace it.",
                  ),
              },
              "PART3C": {
                  17: (
                      "General Intelligence and Internal Security are completely separate sections, so even aboard the same ship I couldn't identify them.",
                      "General Intelligence and Internal Security are separate, so even aboard the same ship I couldn't identify them.",
                  ),
                  114: (
                      "The person offering you sanctuary may be behind the bombing, an agent of a third country. If so, does your destination for defection really have to be Britain?",
                      "The person offering sanctuary may be the bomber, an agent of a third country. If so, must you really defect to Britain?",
                  ),
                  132: (
                      "The culprit won't disarm the bomb. This ship is evidence of the theft, so he can't let it reach Southampton. At 7:00 p.m. the bomb will destroy it. Our only move is to catch the culprit, tie him up in front of the bomb, and make him disarm it himself.",
                      "The culprit won't disarm it. This ship proves the theft, so he can't let it reach Southampton. At 7 p.m. the bomb destroys it. We must catch him, tie him before it, and force him to disarm it.",
                  ),
                  189: (
                      "The accomplice is Dunant. Because I kept pressing my suspicion of Ashby, Ashby had Dunant write the second claim statement. It was rushed and lacked planning.",
                      "The accomplice is Dunant. I kept pressing Ashby, so he had Dunant write the second claim statement in a rush. It lacked planning.",
                  ),
              },
          }

          touched = []
          for chapter, chapter_changes in changes.items():
              path = Path("work/clean_rebuild/sources") / f"{chapter}.json"
              payload = json.loads(path.read_text(encoding="utf-8"))
              records = {record["index"]: record for record in payload["records"]}
              required = (payload.get("profile") or {}).get("required_text_exact") or {}
              for index, (before, after) in chapter_changes.items():
                  current = records[index].get("text")
                  if current != before:
                      raise SystemExit(
                          f"{chapter}:{index:03d}: expected {before!r}, got {current!r}"
                      )
                  records[index]["text"] = after
                  if str(index) in required:
                      required[str(index)] = after
              path.write_text(
                  json.dumps(payload, indent=2, ensure_ascii=False) + "\n",
                  encoding="utf-8",
              )
              touched.append(str(path))

          expected = {
              "work/clean_rebuild/sources/PART2A.json",
              "work/clean_rebuild/sources/PART3C.json",
          }
          if set(touched) != expected:
              raise SystemExit(f"unexpected touched set: {touched}")
          print("Applied 5 exact-match retail capacity fixes")
          PY
          test "$(git diff --name-only | sort)" = $'work/clean_rebuild/sources/PART2A.json\nwork/clean_rebuild/sources/PART3C.json'
      - name: Validate source tree
        run: |
          python tools/source_health.py --root . --strict-release
          python -m compileall -q nostalgia1907.py tools work tests
          python -m unittest discover -s tests -v
          python tools/style_audit.py --root .
      - name: Commit canonical capacity fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work/clean_rebuild/sources/PART2A.json work/clean_rebuild/sources/PART3C.json
          git diff --cached --quiet && { echo "No canonical changes to commit"; exit 1; }
          git commit -m "translation: apply retail-backed capacity fixes"
          git push origin HEAD:translation-source-corrections-20260827
