name: Apply retail renderer layout fixes

on:
  push:
    paths:
      - '.github/workflows/apply-retail-layout-fixes-20260902.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: translation/punchier-opening-20260901
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Apply four retail-validated layout fixes
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('work/clean_rebuild/sources')
          edits = {
              'PART2A': {
                  16: (
                      "First class...even on this little ship, it felt worlds away from second class.",
                      "First class...even on this little ship, worlds away from second class.",
                  ),
                  78: (
                      "From first class to the captain's cabin. Good. I can retrace the route.",
                      "From first class to the captain's cabin. Good. I'll retrace it.",
                  ),
              },
              'PART2D': {
                  13: (
                      "The Anglo-Japanese Alliance...though the balance of power is overwhelmingly unequal.",
                      "The Anglo-Japanese Alliance...though the two powers are hardly equals.",
                  ),
              },
              'PART3C': {
                  174: (
                      "Enough...get emotionally involved and life will make you pay for it...",
                      "Enough...get emotionally involved and life makes you pay...",
                  ),
              },
          }

          changed = []
          for chapter, mapping in edits.items():
              path = root / f'{chapter}.json'
              data = json.loads(path.read_text(encoding='utf-8'))
              records = {r['index']: r for r in data['records']}
              exact = (data.get('profile') or {}).get('required_text_exact', {})
              for idx, (old, new) in mapping.items():
                  actual = records[idx].get('text')
                  if actual != old:
                      raise AssertionError(f'{chapter}:{idx:03d}: expected {old!r}, found {actual!r}')
                  records[idx]['text'] = new
                  if str(idx) in exact:
                      if exact[str(idx)] != old:
                          raise AssertionError(f'{chapter}:{idx:03d}: profile lock mismatch: {exact[str(idx)]!r}')
                      exact[str(idx)] = new
                  changed.append(f'{chapter}:{idx:03d}')
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          if changed != ['PART2A:016', 'PART2A:078', 'PART2D:013', 'PART3C:174']:
              raise AssertionError(changed)
          print('Applied:', ', '.join(changed))
          PY
      - name: Refresh source manifest
        run: python tools/source_manifest.py --root . --write
      - name: Verify source-only suite
        shell: bash
        run: |
          python tools/source_health.py --root . --strict-release
          python tools/source_manifest.py --root .
          python -m compileall -q nostalgia1907.py tools tests work
          python -m unittest discover -s tests -v
          python -m ruff check nostalgia1907.py tools tests work
          python tools/style_audit.py --root .
      - name: Verify only expected source files changed
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(['git','diff','--name-only','HEAD'], text=True).splitlines())
          expected = {
              'MANIFEST.sha256',
              'work/clean_rebuild/sources/PART2A.json',
              'work/clean_rebuild/sources/PART2D.json',
              'work/clean_rebuild/sources/PART3C.json',
          }
          if changed != expected:
              raise SystemExit(f'Unexpected diff: {sorted(changed)}')
          print('Scope PASS')
          PY
      - name: Commit retail layout fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MANIFEST.sha256 work/clean_rebuild/sources/PART2A.json work/clean_rebuild/sources/PART2D.json work/clean_rebuild/sources/PART3C.json
          git commit -m "Fit reviewed dialogue to retail renderer bounds"
          git push origin HEAD:translation/punchier-opening-20260901
