name: Apply secondary cast voice pass 20260827

on:
  push:
    branches:
      - translation-source-corrections-20260827
    paths:
      - .github/workflows/apply-secondary-cast-voice-20260827.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: translation-source-corrections-20260827
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project tooling
        run: python -m pip install -e .
      - name: Apply exact-match secondary cast edits
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          pass_path = Path('work/reviewed_changes/secondary_cast_voice_pass_20260827.json')
          payload = json.loads(pass_path.read_text(encoding='utf-8'))
          changes = payload['changes']
          if len(changes) != 3:
              raise SystemExit(f'expected 3 secondary-cast changes, got {len(changes)}')

          sources = Path('work/clean_rebuild/sources')
          by_chapter = {}
          seen = set()
          for item in changes:
              stable_id = item['id']
              if stable_id in seen:
                  raise SystemExit(f'duplicate stable ID: {stable_id}')
              seen.add(stable_id)
              chapter, raw_index = stable_id.split(':', 1)
              if len(raw_index) != 3 or not raw_index.isdigit():
                  raise SystemExit(f'noncanonical stable ID: {stable_id}')
              by_chapter.setdefault(chapter, []).append((int(raw_index), item))

          if set(by_chapter) != {'PART2C', 'PART3B_'}:
              raise SystemExit(f'unexpected chapter set: {sorted(by_chapter)}')

          staged = []
          for chapter, chapter_changes in sorted(by_chapter.items()):
              path = sources / f'{chapter}.json'
              doc = json.loads(path.read_text(encoding='utf-8'))
              if doc.get('chapter') != chapter:
                  raise SystemExit(f'{chapter}: chapter metadata mismatch')
              records = {record['index']: record for record in doc['records']}
              if len(records) != len(doc['records']):
                  raise SystemExit(f'{chapter}: duplicate record indexes')
              exact_locks = (doc.get('profile') or {}).get('required_text_exact', {})

              for index, item in sorted(chapter_changes):
                  stable_id = item['id']
                  record = records.get(index)
                  if record is None:
                      raise SystemExit(f'{stable_id}: missing canonical record')
                  if record.get('policy') != 'translate':
                      raise SystemExit(f'{stable_id}: record is not translatable')
                  current = record.get('text')
                  if current != item['before']:
                      raise SystemExit(
                          f'{stable_id}: stale before-text; expected {item["before"]!r}, got {current!r}'
                      )
                  record['text'] = item['after']
                  key = str(index)
                  if key in exact_locks:
                      if exact_locks[key] != item['before']:
                          raise SystemExit(
                              f'{stable_id}: profile lock mismatch; expected {item["before"]!r}, '
                              f'got {exact_locks[key]!r}'
                          )
                      exact_locks[key] = item['after']

              temp = path.with_suffix(path.suffix + '.voice.tmp')
              temp.write_text(json.dumps(doc, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              json.loads(temp.read_text(encoding='utf-8'))
              staged.append((path, temp))

          for path, temp in staged:
              os.replace(temp, path)

          cache = {}
          for item in changes:
              chapter, raw_index = item['id'].split(':', 1)
              index = int(raw_index)
              if chapter not in cache:
                  doc = json.loads((sources / f'{chapter}.json').read_text(encoding='utf-8'))
                  cache[chapter] = {r['index']: r for r in doc['records']}
              actual = cache[chapter][index].get('text')
              if actual != item['after']:
                  raise SystemExit(f'{item["id"]}: post-application mismatch')
          print(f'PASS: all {len(changes)} secondary-cast targets applied exactly')
          PY

          changed="$(git diff --name-only -- work/clean_rebuild/sources | sort)"
          expected=$'work/clean_rebuild/sources/PART2C.json\nwork/clean_rebuild/sources/PART3B_.json'
          if [ "$changed" != "$expected" ]; then
            printf 'Unexpected canonical diff set:\n%s\n' "$changed"
            exit 1
          fi
          git diff --check
      - name: Validate source tree
        shell: bash
        run: |
          python tools/source_health.py --root . --strict-release
          python -m compileall -q nostalgia1907.py tools work tests
          python -m unittest discover -s tests -v
      - name: Commit canonical secondary cast edits
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add work/clean_rebuild/sources/PART2C.json work/clean_rebuild/sources/PART3B_.json
          git commit -m 'translation: apply secondary cast voice pass'
          git push origin HEAD:translation-source-corrections-20260827
