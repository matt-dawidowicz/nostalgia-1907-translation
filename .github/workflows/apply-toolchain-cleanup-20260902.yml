          for relative in ('CONTRIBUTING.md', 'docs/DEVELOPMENT.md', 'docs/GETTING_STARTED.md', 'docs/ARCHITECTURE.md', 'docs/WHOLE_GAME_TESTING.md'):
              doc = root / relative
