          text = text.replace('        "production_dependency_audit": dependency_audit,\n', '')
          text = text.replace('    notes = _render_test_notes(coverage, dependency_audit)\n', '    notes = _render_test_notes(coverage)\n')
          path.write_text(text, encoding='utf-8', newline='\n')

          # Deduplicate equivalent LZ transitions while preserving first-candidate tie order.
          path = root / 'work' / 'clean_rebuild' / 'lz_format.py'
          text = path.read_text(encoding='utf-8')
          old = '''    operations: list[Op] = []\n    for source in matching[first:last]:\n        distance = source - (position - 1)\n        length = _match_length(data, position, distance, min(256, position))\n        if length >= 2 and distance <= 0xFF:\n            operations.append(("copy2", 2, distance))\n        if length >= 3 and distance <= 0x1FF:\n            operations.append(("copy3", 3, distance))\n        if length >= 4 and distance <= 0x3FF:\n            operations.append(("copy4", 4, distance))\n        operations.extend(\n            ("copylong", candidate_length, distance)\n            for candidate_length in range(5, length + 1)\n        )\n    return operations\n'''
          new = '''    operations: list[Op] = []\n    emitted_short: set[str] = set()\n    longest_emitted = 4\n    for source in matching[first:last]:\n        distance = source - (position - 1)\n        length = _match_length(data, position, distance, min(256, position))\n        if length >= 2 and distance <= 0xFF and "copy2" not in emitted_short:\n            operations.append(("copy2", 2, distance))\n            emitted_short.add("copy2")\n        if length >= 3 and distance <= 0x1FF and "copy3" not in emitted_short:\n            operations.append(("copy3", 3, distance))\n            emitted_short.add("copy3")\n        if length >= 4 and distance <= 0x3FF and "copy4" not in emitted_short:\n            operations.append(("copy4", 4, distance))\n            emitted_short.add("copy4")\n        if length > longest_emitted:\n            start = max(5, longest_emitted + 1)\n            operations.extend(\n                ("copylong", candidate_length, distance)\n                for candidate_length in range(start, length + 1)\n            )\n            longest_emitted = length\n    return operations\n'''
          if old not in text:
              raise RuntimeError('lz_format.py: candidate enumeration block not found')
          path.write_text(text.replace(old, new), encoding='utf-8', newline='\n')

          (root / 'tests' / 'test_lz_optimizer.py').write_text(
              '''"""Regressions for deterministic LZ candidate pruning."""\n\nfrom __future__ import annotations\n\nimport unittest\n\nfrom work.clean_rebuild import lz_format\n\n\nclass LzOptimizerTests(unittest.TestCase):\n    """Keep candidate pruning byte-safe and deterministic."""\n\n    def test_copy_candidates_keep_one_transition_per_kind_and_length(self) -> None:\n        """Discard only equal-cost duplicate transitions with later distances."""\n        data = (b"ABCD" * 96) + (b"ABCD" * 96)\n        positions: list[list[int]] = [[] for _ in range(256)]\n        for index, byte in enumerate(data):\n            positions[byte].append(index)\n        operations = lz_format._copy_candidates(data, positions, len(data))\n        keys = [(kind, length) for kind, length, _distance in operations]\n        self.assertEqual(len(keys), len(set(keys)))\n\n    def test_repetitive_payload_round_trips_deterministically(self) -> None:\n        """Preserve exact deterministic output while exercising many matches."""\n        data = (b"NOSTALGIA 1907 ... " * 128) + bytes(range(256))\n        first = lz_format.compress(data)\n        second = lz_format.compress(data)\n        self.assertEqual(first, second)\n        self.assertEqual(lz_format.decompress(first, len(data)), data)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''',
              encoding='utf-8',
              newline='\n',
          )

          # Documentation tests enforce public API coverage instead of every private helper.
          path = root / 'tests' / 'test_documentation.py'
          text = path.read_text(encoding='utf-8')
          text, count = re.subn(
              r'    def test_maintained_python_has_complete_pep257_coverage\(self\) -> None:\n.*?\n\n\nif __name__ == "__main__":',
              '''    def test_maintained_python_has_documented_public_api(self) -> None:\n        """Require structural docstrings on modules and public top-level APIs."""\n        callable_nodes = (ast.ClassDef, ast.FunctionDef, ast.AsyncFunctionDef)\n        for path in maintained_python():\n            tree = ast.parse(path.read_text(encoding="utf-8"))\n            nodes = [tree]\n            for node in tree.body:\n                if isinstance(node, callable_nodes) and not node.name.startswith("_"):\n                    nodes.append(node)\n                    if isinstance(node, ast.ClassDef):\n                        nodes.extend(\n                            member\n                            for member in node.body\n                            if isinstance(member, (ast.FunctionDef, ast.AsyncFunctionDef))\n                            and not member.name.startswith("_")\n                        )\n            for node in nodes:\n                name = "<module>" if node is tree else node.name\n                with self.subTest(path=path.relative_to(ROOT), symbol=name):\n                    docstring = ast.get_docstring(node, clean=False)\n                    self.assertIsNotNone(docstring)\n                    lines = (docstring or "").splitlines()\n                    self.assertTrue(lines and lines[0].strip())\n                    self.assertRegex(lines[0].rstrip(), r"[.!?]$")\n                    if len(lines) > 1:\n                        self.assertEqual(lines[1].strip(), "")\n\n\nif __name__ == "__main__":''',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise RuntimeError('test_documentation.py: old exhaustive docstring test not found')
          path.write_text(text, encoding='utf-8', newline='\n')

          (root / 'docs' / 'DOCSTRING_STANDARD.md').write_text(
              '''# Python documentation standard\n\nThe Python source is part of the preservation record for this project. A future\nmaintainer should be able to understand why a parser, formatter, validator, or\nwriter exists without reconstructing its intent from a generated disc image.\n\n## Supported scope\n\nThe automated contract applies to maintained modules and their public top-level\nclasses/functions/methods. Private and nested helpers require docstrings only\nwhen their behavior is non-obvious, binary-format-sensitive, stateful, or\notherwise benefits from an explicit contract. This avoids ceremonial prose on\nself-explanatory implementation details while preserving documentation where it\nprotects reverse-engineered behavior.\n\nHistorical investigation scripts are evidence from earlier work and are not\nretroactively rewritten to the current standard.\n\n## Formatting profile\n\nPython 3.12 is the minimum supported interpreter. Ruff owns generic linting and\nmodernization checks with the repository's 88-column target. The project does\nnot require a formatter package at runtime or as part of the build. Source text\nuses UTF-8, LF line endings, a final newline, and no trailing whitespace.\n\n## Docstrings\n\nFor maintained public APIs:\n\n1. Write a concise summary ending in punctuation.\n2. Put a blank line after the summary in a multi-line docstring.\n3. Describe purpose and project context rather than restating the symbol name.\n4. Document inputs/outputs whose units, ownership, shape, or constraints are not\n   obvious from type annotations.\n5. Identify meaningful filesystem writes, subprocesses, mutation, and caches.\n6. State recoverable failure conditions where doing so helps callers.\n7. Record assumptions that protect disc layout, determinism, translation data,\n   renderer behavior, or retail provenance.\n\nPrivate helpers should be documented when the reason for their existence is not\nclear from their name, types, surrounding module documentation, and nearby\ncomments. Binary-format constants and unusual algorithms should continue to\ncarry strong explanatory documentation even when their symbols are private.\n\n## Explanatory comments\n\nComments should explain *why* a non-obvious step exists, especially around disc\ngeometry, reverse-engineered formats, renderer behavior, or deterministic\noutput. Do not narrate obvious Python syntax or duplicate a docstring.\n\n## Review checklist\n\nBefore committing a Python change:\n\n1. Run `python -m tools.source_checks --root . --strict-release`.\n2. Confirm public API documentation still describes behavior.\n3. Confirm non-obvious private binary/renderer logic still has useful context.\n4. Keep comments synchronized with the implementation.\n5. For documentation-only edits, verify executable behavior is unchanged.\n\nAutomation enforces structural coverage on the maintained public API; human\nreview remains responsible for technical accuracy and useful context.\n''',
              encoding='utf-8',
              newline='\n',
          )

          # README and contributor docs describe direct checkout execution, not installation.
          readme = root / 'README.md'
          text = readme.read_text(encoding='utf-8')
          text = text.replace(
              'python -m pip install -e .\n',
