name: Apply repository-local toolchain cleanup

on:
  push:
    branches:
      - audit/repository-toolchain-cleanup-20260902

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v7
        with:
          ref: audit/repository-toolchain-cleanup-20260902
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Apply audited cleanup
        run: python tools/apply_cleanup_20260902.py

      - name: Stage transformed inventory
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          python tools/source_manifest.py --root . --write
          git add MANIFEST.sha256

      - name: Install development checks
        run: python -m pip install -r requirements-dev.txt

      - name: Run authoritative source checks
        run: python -m tools.source_checks --root . --strict-release

      - name: Check patch hygiene
        run: git diff --cached --check

      - name: Remove one-shot applicator
        shell: bash
        run: |
          rm tools/apply_cleanup_20260902.py
          rm .github/workflows/apply-toolchain-cleanup-20260902.yml
          git add -A
          python tools/source_manifest.py --root . --write
          git add MANIFEST.sha256

      - name: Re-run source checks against final staged tree
        run: python -m tools.source_checks --root . --strict-release

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Modernize repository-local translation toolchain"
          git push origin HEAD:audit/repository-toolchain-cleanup-20260902
