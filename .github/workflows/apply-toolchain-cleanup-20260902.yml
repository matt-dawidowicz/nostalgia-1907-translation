name: Apply repository-local toolchain cleanup

on:
  push:
    branches:
      - audit/repository-toolchain-cleanup-20260902

permissions:
  contents: write

concurrency:
  group: apply-toolchain-cleanup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v7
        with:
          ref: audit/repository-toolchain-cleanup-20260902
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Apply audited cleanup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path

          root = Path('.')

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one exact replacement, found {count}')
              path.write_text(text.replace(old, new), encoding='utf-8', newline='\n')

          def regex_once(path: Path, pattern: str, replacement: str) -> None:
              text = path.read_text(encoding='utf-8')
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one regex replacement, found {count}')
              path.write_text(updated, encoding='utf-8', newline='\n')

          # This repository is a directly executed translation/build workspace,
          # not a distributable Python package. Keep pyproject only for tool config.
          (root / 'pyproject.toml').write_text(
              '''[tool.ruff]\nline-length = 88\ntarget-version = "py312"\n\n[tool.ruff.lint]\nselect = ["E4", "E7", "E9", "F", "UP"]\n\n[tool.mypy]\npython_version = "3.12"\ncheck_untyped_defs = true\nno_implicit_optional = true\nwarn_redundant_casts = true\nwarn_unused_configs = true\nwarn_unused_ignores = true\n''',
              encoding='utf-8',
              newline='\n',
          )
          (root / 'requirements-dev.txt').write_text(
              'mypy==2.3.1\nruff==0.16.5\n', encoding='utf-8', newline='\n'
          )

          # Shared tracked-file enumeration replaces two independent Git wrappers.
          (root / 'tools' / 'repository_inventory.py').write_text(
              '''#!/usr/bin/env python3\n"""Enumerate repository files for source-only validation tools."""\n\nfrom __future__ import annotations\n\nimport os\nimport subprocess\nfrom pathlib import Path\n\n\nclass RepositoryInventoryError(RuntimeError):\n    """Report that Git-backed source inventory could not be enumerated."""\n\n\ndef git_tracked_files(root: Path) -> tuple[Path, ...] | None:\n    """Return cached Git paths, or ``None`` for an unpacked source tree."""\n    if not (root / ".git").exists():\n        return None\n    try:\n        completed = subprocess.run(\n            ("git", "-C", str(root), "ls-files", "-z", "--cached"),\n            check=True,\n            capture_output=True,\n        )\n    except (OSError, subprocess.CalledProcessError) as error:\n        raise RepositoryInventoryError(\n            "could not enumerate Git-tracked source files"\n        ) from error\n    relative_paths = tuple(\n        Path(os.fsdecode(raw_path))\n        for raw_path in completed.stdout.split(b"\\0")\n        if raw_path\n    )\n    missing = tuple(path for path in relative_paths if not (root / path).is_file())\n    if missing:\n        names = ", ".join(path.as_posix() for path in missing[:5])\n        suffix = " ..." if len(missing) > 5 else ""\n        raise RepositoryInventoryError(\n            f"tracked source files are missing from the checkout: {names}{suffix}"\n        )\n    return relative_paths\n''',
              encoding='utf-8',
              newline='\n',
          )

          # One source-check command is authoritative for both CI and local validate.
          (root / 'tools' / 'source_checks.py').write_text(
              '''#!/usr/bin/env python3\n"""Run the repository's complete source-only validation contract."""\n\nfrom __future__ import annotations\n\nimport argparse\nimport subprocess\nimport sys\nfrom collections.abc import Sequence\nfrom pathlib import Path\n\nfrom tools import source_health, source_manifest, style_audit\nfrom work.clean_rebuild import rebuild as clean_rebuild\n\n\nROOT = Path(__file__).resolve().parents[1]\nCHECK_PATHS = ("nostalgia1907.py", "tools", "tests", "work")\nMYPY_TARGETS = (\n    "tools/repository_inventory.py",\n    "tools/source_checks.py",\n    "tools/source_health.py",\n    "tools/source_manifest.py",\n    "tools/style_audit.py",\n    "work/clean_rebuild/source_json.py",\n    "work/clean_rebuild/raw_cd.py",\n    "work/clean_rebuild/iso9660.py",\n    "work/clean_rebuild/lz_format.py",\n)\n\n\nclass SourceCheckError(RuntimeError):\n    """Report a failed source-only validation stage."""\n\n\ndef _run(command: Sequence[str], *, root: Path, label: str) -> None:\n    """Run one isolated external check and preserve its native diagnostics."""\n    print(f"\\n== {label} ==", flush=True)\n    completed = subprocess.run(tuple(command), cwd=root, check=False)\n    if completed.returncode:\n        raise SourceCheckError(f"{label} failed with exit code {completed.returncode}")\n\n\ndef run_source_checks(root: Path, *, strict_release: bool) -> None:\n    """Run every source-only gate used by contributors and CI."""\n    root = root.resolve()\n\n    print("\\n== Source-tree health audit ==", flush=True)\n    health = source_health.audit(root, strict_release=strict_release)\n    if health["status"] != "PASS":\n        for failure in health["failures"]:\n            print(f"- {failure}")\n        raise SourceCheckError("source-tree health audit failed")\n    print(\n        f"PASS: {health['files_checked']} files checked "\n        f"({health['inventory_mode']})."\n    )\n\n    print("\\n== Source review manifest ==", flush=True)\n    valid, differences = source_manifest.check_manifest(root)\n    if not valid:\n        for difference in differences[: source_manifest.MAX_DIFF_LINES]:\n            print(f"- {difference}")\n        raise SourceCheckError("source review manifest is stale")\n    print(f"{source_manifest.MANIFEST_NAME}: PASS")\n\n    print("\\n== Production dependency policy ==", flush=True)\n    dependency = clean_rebuild._verify_production_independence()\n    print(\n        f"PASS: {dependency['modules_scanned']} production modules and "\n        f"{dependency['data_files_scanned']} tracked data files checked."\n    )\n\n    _run(\n        (sys.executable, "-m", "compileall", "-q", *CHECK_PATHS),\n        root=root,\n        label="Maintained Python compilation",\n    )\n    _run(\n        (sys.executable, "-m", "unittest", "discover", "-s", "tests", "-v"),\n        root=root,\n        label="Source-only unit and integration tests",\n    )\n    _run(\n        (sys.executable, "-m", "ruff", "check", *CHECK_PATHS),\n        root=root,\n        label="Ruff lint checks",\n    )\n    _run(\n        (sys.executable, "-m", "mypy", *MYPY_TARGETS),\n        root=root,\n        label="Static type checks",\n    )\n\n    print("\\n== Public API documentation audit ==", flush=True)\n    documentation = style_audit.audit(root)\n    if documentation["status"] != "PASS":\n        for violation in documentation["violations"]:\n            print(\n                f"{violation['path']}:{violation['line']}: "\n                f"{violation['rule']} {violation['message']}"\n            )\n        raise SourceCheckError("public API documentation audit failed")\n    print(\n        f"PASS: {documentation['files_checked']} maintained Python files checked."\n    )\n\n\ndef parse_args(argv: Sequence[str] | None = None) -> argparse.Namespace:\n    """Parse source-check command-line arguments."""\n    parser = argparse.ArgumentParser(description=__doc__)\n    parser.add_argument("--root", type=Path, default=ROOT)\n    parser.add_argument(\n        "--strict-release",\n        action="store_true",\n        help="audit the exact staged/tracked release inventory",\n    )\n    return parser.parse_args(argv)\n\n\ndef main(argv: Sequence[str] | None = None) -> int:\n    """Run source checks and return a shell-friendly status."""\n    args = parse_args(argv)\n    try:\n        run_source_checks(args.root, strict_release=args.strict_release)\n    except (SourceCheckError, ValueError, OSError) as error:\n        print(f"ERROR: {error}", file=sys.stderr)\n        return 1\n    print("\\nAll source-only checks passed.")\n    return 0\n\n\nif __name__ == "__main__":\n    raise SystemExit(main())\n''',
              encoding='utf-8',
              newline='\n',
          )

          # source_health: share Git enumeration and prune excluded trees before descent.
          path = root / 'tools' / 'source_health.py'
          text = path.read_text(encoding='utf-8')
          text = text.replace('import os\nimport subprocess\n', '')
          text = text.replace(
              'from pathlib import Path\n',
              'from pathlib import Path\n\nfrom tools.repository_inventory import RepositoryInventoryError, git_tracked_files\n',
          )
          text, count = re.subn(
              r'def _git_tracked_files\(root: Path\) -> tuple\[Path, \.\.\.\] \| None:\n.*?\n\ndef iter_source_files',
              '''def _git_tracked_files(root: Path) -> tuple[Path, ...] | None:\n    """Return Git-tracked files while preserving this tool's error type."""\n    try:\n        return git_tracked_files(root)\n    except RepositoryInventoryError as error:\n        raise SourceInventoryError(str(error)) from error\n\n\ndef _excluded_directory_name(name: str) -> bool:\n    """Return whether development traversal should skip a directory entirely."""\n    return (\n        name in EXCLUDED_DIRECTORY_NAMES\n        or name.endswith(".egg-info")\n        or any(name.startswith(prefix) for prefix in EXCLUDED_DIRECTORY_PREFIXES)\n    )\n\n\ndef iter_source_files''',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise RuntimeError('source_health.py: could not replace Git inventory helper')
          text, count = re.subn(
              r'def iter_source_files\(root: Path\) -> Iterable\[Path\]:\n.*?\n\ndef iter_release_files',
              '''def iter_source_files(root: Path) -> Iterable[Path]:\n    """Yield source files while pruning generated/local trees before descent."""\n    for directory, directory_names, file_names in root.walk(top_down=True):\n        directory_names[:] = sorted(\n            name for name in directory_names if not _excluded_directory_name(name)\n        )\n        for name in sorted(file_names):\n            yield directory / name\n\n\ndef iter_release_files''',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise RuntimeError('source_health.py: could not replace development walker')
          path.write_text(text, encoding='utf-8', newline='\n')

          # source_manifest: share the same staged/tracked Git enumeration helper.
          path = root / 'tools' / 'source_manifest.py'
          text = path.read_text(encoding='utf-8')
          text = text.replace('import os\nimport subprocess\n', '')
          text = text.replace(
              'from pathlib import Path\n',
              'from pathlib import Path\n\nfrom tools.repository_inventory import RepositoryInventoryError, git_tracked_files\n',
          )
          text, count = re.subn(
              r'def _git_tracked_files\(root: Path\) -> tuple\[Path, \.\.\.\] \| None:\n.*?\n\ndef manifest_files',
              '''def _git_tracked_files(root: Path) -> tuple[Path, ...] | None:\n    """Return tracked files while preserving manifest-specific diagnostics."""\n    try:\n        return git_tracked_files(root)\n    except RepositoryInventoryError as error:\n        raise ManifestInventoryError(str(error)) from error\n\n\ndef manifest_files''',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise RuntimeError('source_manifest.py: could not replace Git inventory helper')
          path.write_text(text, encoding='utf-8', newline='\n')

          # Public-API docstrings remain enforced; private/nested helpers no longer need ceremony.
          (root / 'tools' / 'style_audit.py').write_text(
              '''#!/usr/bin/env python3\n"""Audit maintained Python public APIs against the project's docstring contract."""\n\nfrom __future__ import annotations\n\nimport argparse\nimport ast\nimport json\nfrom collections.abc import Iterable, Sequence\nfrom dataclasses import asdict, dataclass\nfrom pathlib import Path\n\n\nMAINTAINED_DIRECTORIES = (\n    "tools",\n    "tests",\n    "work/clean_rebuild",\n    "work/region_variant",\n)\nDOCUMENTED_NODES = (ast.ClassDef, ast.FunctionDef, ast.AsyncFunctionDef)\n\n\n@dataclass(frozen=True)\nclass DocumentationViolation:\n    """Describe one actionable public-documentation violation."""\n\n    path: str\n    line: int\n    rule: str\n    message: str\n\n\ndef project_root() -> Path:\n    """Return the repository root containing this audit tool."""\n    return Path(__file__).resolve().parents[1]\n\n\ndef iter_maintained_python(root: Path) -> tuple[Path, ...]:\n    """Return Python files covered by the maintained-code policy."""\n    paths = [root / "nostalgia1907.py"]\n    for relative in MAINTAINED_DIRECTORIES:\n        directory = root / relative\n        if directory.is_dir():\n            paths.extend(directory.rglob("*.py"))\n    return tuple(sorted(paths))\n\n\ndef _docstring_nodes(tree: ast.Module) -> Iterable[ast.AST]:\n    """Yield the module plus top-level public symbols and public class methods."""\n    yield tree\n    for node in tree.body:\n        if not isinstance(node, DOCUMENTED_NODES) or node.name.startswith("_"):\n            continue\n        yield node\n        if isinstance(node, ast.ClassDef):\n            for member in node.body:\n                if isinstance(member, (ast.FunctionDef, ast.AsyncFunctionDef)) and not member.name.startswith("_"):\n                    yield member\n\n\ndef _symbol_name(node: ast.AST) -> str:\n    """Return a stable display name for a documented AST symbol."""\n    if isinstance(node, ast.Module):\n        return "<module>"\n    if isinstance(node, DOCUMENTED_NODES):\n        return node.name\n    raise TypeError(f"unsupported documented node: {type(node).__name__}")\n\n\ndef _audit_docstrings(path: Path, tree: ast.Module, root: Path) -> list[DocumentationViolation]:\n    """Return public-documentation violations for one maintained module."""\n    violations: list[DocumentationViolation] = []\n    relative = path.relative_to(root).as_posix()\n    for node in _docstring_nodes(tree):\n        line_number = getattr(node, "lineno", 1)\n        symbol = _symbol_name(node)\n        docstring = ast.get_docstring(node, clean=False)\n        if docstring is None:\n            violations.append(DocumentationViolation(relative, line_number, "D100", f"{symbol} is missing a docstring."))\n            continue\n        lines = docstring.splitlines()\n        if not lines or not lines[0].strip():\n            violations.append(DocumentationViolation(relative, line_number, "D101", f"{symbol} has an empty docstring summary."))\n            continue\n        if lines[0].rstrip()[-1:] not in ".!?":\n            violations.append(DocumentationViolation(relative, line_number, "D102", f"{symbol} docstring summary must end with punctuation."))\n        if len(lines) > 1 and lines[1].strip():\n            violations.append(DocumentationViolation(relative, line_number, "D103", f"{symbol} multiline docstring needs a blank second line."))\n    return violations\n\n\ndef audit(root: Path) -> dict[str, object]:\n    """Audit maintained public docstrings and return a deterministic report."""\n    violations: list[DocumentationViolation] = []\n    paths = iter_maintained_python(root)\n    for path in paths:\n        try:\n            tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))\n        except SyntaxError as error:\n            violations.append(DocumentationViolation(path.relative_to(root).as_posix(), error.lineno or 1, "D000", f"Cannot inspect docstrings because source does not parse: {error.msg}."))\n            continue\n        violations.extend(_audit_docstrings(path, tree, root))\n    ordered = sorted(violations, key=lambda item: (item.path, item.line, item.rule))\n    return {\n        "status": "PASS" if not ordered else "FAIL",\n        "files_checked": len(paths),\n        "violations": [asdict(violation) for violation in ordered],\n    }\n\ndef parse_args(argv: Sequence[str] | None = None) -> argparse.Namespace:\n    """Parse command-line arguments for the documentation audit."""\n    parser = argparse.ArgumentParser(description=__doc__)\n    parser.add_argument("--root", type=Path, default=project_root())\n    parser.add_argument("--json", action="store_true", help="print the complete report as JSON")\n    return parser.parse_args(argv)\n\ndef main(argv: Sequence[str] | None = None) -> int:\n    """Run the public-documentation audit and return a shell-friendly status."""\n    arguments = parse_args(argv)\n    report = audit(arguments.root.resolve())\n    if arguments.json:\n        print(json.dumps(report, indent=2, sort_keys=True))\n    else:\n        print(f"{report['status']}: {report['files_checked']} files checked; {len(report['violations'])} documentation violations.")\n        for violation in report["violations"]:\n            print(f"{violation['path']}:{violation['line']}: {violation['rule']} {violation['message']}")\n    return 0 if report["status"] == "PASS" else 1\n\nif __name__ == "__main__":\n    raise SystemExit(main())\n''',
              encoding='utf-8',
              newline='\n',
          )

          # Retire no-op renderer-profile migration fields from canonical source.
          legacy_profile_fields = {
              'choice_render_cell_limit',
              'require_choice_segments',
              'exclude_choice_segments_from_wrap',
              'infer_scn_layouts',
              'infer_all_replacement_segments',
              'require_selector_window_segments',
              'scn_selector_window_subtypes',
              'validate_runtime_row_boundaries',
              'validate_text_hygiene',
              'validate_wrapped_text_integrity',
              'validate_scn_floating_row_limits',
              'validate_single_option_transition_rows',
              'no_pad_final_row_segments',
              'single_option_transition_row_exclude',
              'preserve_previous_wrapped_text',
              'preserve_previous_wrapped_text_exclude',
          }
          source_root = root / 'work' / 'clean_rebuild' / 'sources'
          index = json.loads((source_root / 'index.json').read_text(encoding='utf-8'))
          removed_profile_fields = 0
          for item in index['chapters']:
              source_path = source_root / item['source']
              source = json.loads(source_path.read_text(encoding='utf-8'))
              profile = source.get('profile')
              if isinstance(profile, dict):
                  for field in tuple(profile):
                      if field in legacy_profile_fields:
                          del profile[field]
                          removed_profile_fields += 1
              source_path.write_text(
                  json.dumps(source, ensure_ascii=False, indent=2) + '\n',
                  encoding='utf-8',
                  newline='\n',
              )
          if removed_profile_fields == 0:
              raise RuntimeError('expected canonical legacy profile fields to remove')

          path = root / 'work' / 'clean_rebuild' / 'profile_schema.py'
          text = path.read_text(encoding='utf-8')
          text, count = re.subn(
              r'LEGACY_PROFILE_FIELDS = frozenset\(\n.*?\n\)\n\n',
              '',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise RuntimeError('profile_schema.py: legacy field declaration not found')
          text = text.replace(
              '    unknown = set(profile) - ACTIVE_PROFILE_FIELDS - LEGACY_PROFILE_FIELDS\n',
              '    unknown = set(profile) - ACTIVE_PROFILE_FIELDS\n',
          )
          text = text.replace(
              '    """Validate profile identity and return present legacy no-op fields.\n',
              '    """Validate profile identity and reject retired or unknown fields.\n',
          )
          text = text.replace(
              '        Legacy field names present in the profile. They are accepted for\n        provenance but have no production effect.\n',
              '        An empty compatibility set. Retired migration fields are rejected.\n',
          )
          text = text.replace(
              '    return frozenset(set(profile).intersection(LEGACY_PROFILE_FIELDS))\n',
              '    return frozenset()\n',
          )
          path.write_text(text, encoding='utf-8', newline='\n')

          # Profile tests now defend the clean schema rather than the migration residue.
          path = root / 'tests' / 'test_profile_schema.py'
          text = path.read_text(encoding='utf-8')
          text = text.replace('from pathlib import Path\n\n\nROOT = Path(__file__).resolve().parents[1]\nCLEAN = ROOT / "work" / "clean_rebuild"\nSOURCES = CLEAN / "sources"\n\nfrom work.clean_rebuild.profile_schema import profile_text_failures, validate_profile  # noqa: E402\nfrom work.clean_rebuild.source_json import load_json_object  # noqa: E402\n', 'from pathlib import Path\n\nfrom work.clean_rebuild.profile_schema import profile_text_failures, validate_profile\nfrom work.clean_rebuild.source_json import load_json_object\n\n\nROOT = Path(__file__).resolve().parents[1]\nCLEAN = ROOT / "work" / "clean_rebuild"\nSOURCES = CLEAN / "sources"\n')
          text = text.replace('    """Keep live profile settings distinct from accepted legacy metadata."""\n', '    """Keep canonical renderer profiles limited to live production fields."""\n')
          old_test = '''    def test_all_canonical_profiles_and_text_rules_pass(self) -> None:\n        """Validate every tracked profile without requiring retail fixtures."""\n        index = load_json_object(SOURCES / "index.json")\n        legacy_fields: set[str] = set()\n        for item in index["chapters"]:\n            source = load_json_object(SOURCES / item["source"])\n            chapter = source["chapter"]\n            with self.subTest(chapter=chapter):\n                legacy_fields.update(\n                    validate_profile(source.get("profile"), chapter=chapter)\n                )\n                self.assertEqual(\n                    profile_text_failures(\n                        source.get("profile"),\n                        source["records"],\n                        chapter=chapter,\n                    ),\n                    [],\n                )\n        self.assertIn("validate_wrapped_text_integrity", legacy_fields)\n        self.assertIn("choice_render_cell_limit", legacy_fields)\n'''
          new_test = '''    def test_all_canonical_profiles_and_text_rules_pass(self) -> None:\n        """Validate every tracked profile without retired migration fields."""\n        index = load_json_object(SOURCES / "index.json")\n        for item in index["chapters"]:\n            source = load_json_object(SOURCES / item["source"])\n            chapter = source["chapter"]\n            with self.subTest(chapter=chapter):\n                self.assertEqual(\n                    validate_profile(source.get("profile"), chapter=chapter),\n                    frozenset(),\n                )\n                self.assertEqual(\n                    profile_text_failures(\n                        source.get("profile"),\n                        source["records"],\n                        chapter=chapter,\n                    ),\n                    [],\n                )\n\n    def test_retired_profile_field_is_rejected(self) -> None:\n        """Prevent migration-era no-op settings from returning to canonical data."""\n        with self.assertRaisesRegex(ValueError, "unknown fields"):\n            validate_profile(\n                {"schema_version": 1, "choice_render_cell_limit": None},\n                chapter="TEST",\n            )\n'''
          if old_test not in text:
              raise RuntimeError('test_profile_schema.py: legacy-profile test block not found')
          path.write_text(text.replace(old_test, new_test), encoding='utf-8', newline='\n')

          # The root CLI delegates strict JSON parsing and uses the same source-check gate as CI.
          path = root / 'nostalgia1907.py'
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'from typing import Any\n',
              'from typing import Any\n\nfrom work.clean_rebuild.source_json import load_json_object as _strict_load_json_object\n',
          )
          text, count = re.subn(
              r'class DuplicateJsonKeyError\(ValueError\):\n.*?\n\n# Project discovery, configuration, and immutable input guards\.',
              '''def load_json_object(path: Path, *, label: str) -> dict[str, Any]:\n    """Load one strict UTF-8 JSON object and translate expected input errors."""\n    try:\n        return _strict_load_json_object(path)\n    except FileNotFoundError as error:\n        raise ToolError(f"missing {label}: {path}") from error\n    except ValueError as error:\n        raise ToolError(f"invalid {label}: {error}") from error\n\n\n# Project discovery, configuration, and immutable input guards.''',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise RuntimeError('nostalgia1907.py: strict JSON helper block not found')
          text, count = re.subn(
              r'def operator_python_sources\(root: Path, manifest: dict\[str, Any\]\) -> list\[Path\]:\n.*?\n\ndef command_compare',
              'def command_compare',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise RuntimeError('nostalgia1907.py: obsolete source enumerator not found')
          text, count = re.subn(
              r'(def command_validate\(root: Path, args: argparse\.Namespace\) -> int:\n.*?\n    manifest = load_manifest\(root\)\n).*?(    retail = require_retail_reference\(root, manifest\)\n)',
              r'''\1    run_script(\n        root,\n        "tools/source_checks.py",\n        "--root",\n        str(root),\n        "--strict-release",\n        label="Complete source-only validation",\n    )\n\2''',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise RuntimeError('nostalgia1907.py: source-validation stage block not found')
          text = text.replace(
              '    except (ToolError, FileNotFoundError, PermissionError, ValueError) as exc:\n',
              '    except (ToolError, FileNotFoundError, PermissionError) as exc:\n',
          )
          path.write_text(text, encoding='utf-8', newline='\n')

          # Integration tests belong under tests/, not beside byte-producing modules.
          old_test_path = root / 'work' / 'clean_rebuild' / 'test_script_layout.py'
          new_test_path = root / 'tests' / 'test_script_layout_integration.py'
          test_text = old_test_path.read_text(encoding='utf-8')
          test_text = test_text.replace('from . import mes_compiler\n', 'from work.clean_rebuild import mes_compiler\n')
          test_text = re.sub(r'from \.([A-Za-z0-9_]+) import ', r'from work.clean_rebuild.\1 import ', test_text)
          new_test_path.write_text(test_text, encoding='utf-8', newline='\n')
          old_test_path.unlink()

          path = root / 'tests' / 'test_code_invariants.py'
          text = path.read_text(encoding='utf-8')
          text = text.replace('from work.clean_rebuild import test_script_layout as layout_tests  # noqa: E402\n', '')
          text = text.replace('  # noqa: E402', '')
          # Move constants below ordinary imports now that sys.path surgery is gone.
          constants = 'ROOT = Path(__file__).resolve().parents[1]\nCLEAN = ROOT / "work" / "clean_rebuild"\n\n'
          text = text.replace('\n\n' + constants, '\n\n')
          import_anchor = 'from work.clean_rebuild import translation_formatter\n\n'
          if import_anchor not in text:
              raise RuntimeError('test_code_invariants.py: maintained import anchor not found')
          text = text.replace(import_anchor, import_anchor + '\n' + constants, 1)
          path.write_text(text, encoding='utf-8', newline='\n')

          # The moved integration test is verification evidence, not a build input.
          path = root / 'work' / 'clean_rebuild' / 'verification_manifest.py'
          text = path.read_text(encoding='utf-8')
          text = text.replace('    "test_script_layout.py",\n', '')
          text = text.replace(
              '    for name in ("nostalgia1907.py", "nostalgia1907.project.json", "pyproject.toml"):\n',
              '    for name in ("nostalgia1907.py", "nostalgia1907.project.json"):\n',
          )
          path.write_text(text, encoding='utf-8', newline='\n')

          # Static production independence is a source-quality gate, not work repeated per build.
          path = root / 'work' / 'clean_rebuild' / 'rebuild.py'
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'def _render_test_notes(\n    coverage: dict[str, object],\n    dependency_audit: dict[str, object],\n) -> str:\n',
              'def _render_test_notes(coverage: dict[str, object]) -> str:\n',
          )
          text = re.sub(
              r'        f"A static production dependency audit scanned "\n.*?        "Retail inputs remain separately size- and SHA-256-guarded\.\\n\\n"\n',
              '        "Source-only validation separately enforces the production dependency "\n        "boundary before a release build is accepted.\\n\\n"\n',
