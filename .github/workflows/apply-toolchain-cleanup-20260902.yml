name: Apply repository-local toolchain cleanup

on:
  push:
    branches:
      - audit/repository-toolchain-cleanup-20260902

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v7
        with:
          ref: audit/repository-toolchain-cleanup-20260902
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Apply audited cleanup
        shell: bash
        run: |
          python tools/apply_cleanup_20260902.py
          python tools/fix_cleanup_transform_20260902.py
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_source_health.py")
          text = path.read_text(encoding="utf-8")
          old = '''    def test_ci_uses_the_strict_release_inventory(self) -> None:
                  """Keep public CI from falling back to the development-filtered audit."""
                  workflow = ROOT / ".github" / "workflows" / "source-checks.yml"
                  text = workflow.read_text(encoding="utf-8")
                  self.assertIn("python -m tools.source_checks --root . --strict-release", text)
          '''
          new = '''    def test_authoritative_source_gate_supports_strict_release(self) -> None:
                  """Keep exact-inventory validation exposed by the unified source gate."""
                  source_gate = ROOT / "tools" / "source_checks.py"
                  text = source_gate.read_text(encoding="utf-8")
                  self.assertIn('"--strict-release"', text)
                  self.assertIn("strict_release=args.strict_release", text)
          '''
          if old not in text:
              raise RuntimeError("transformed source-health workflow assertion not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")
          PY
          git checkout HEAD -- .github/workflows/source-checks.yml

      - name: Remove one-shot Python applicators
        shell: bash
        run: |
          rm tools/apply_cleanup_20260902.py
          rm tools/fix_cleanup_transform_20260902.py

      - name: Stage transformed inventory
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          python tools/source_manifest.py --root . --write
          git add MANIFEST.sha256

      - name: Install development checks
        run: python -m pip install -r requirements-dev.txt

      - name: Run authoritative source checks
        run: python -m tools.source_checks --root . --strict-release

      - name: Check patch hygiene
        run: git diff --cached --check

      - name: Commit durable cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Modernize repository-local translation toolchain"
          git push origin HEAD:audit/repository-toolchain-cleanup-20260902
