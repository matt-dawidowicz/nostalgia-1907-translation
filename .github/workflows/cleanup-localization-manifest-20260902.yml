name: Cleanup localization manifest

on:
  push:
    paths:
      - '.github/workflows/cleanup-localization-manifest-20260902.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: translation/punchier-opening-20260901
          fetch-depth: 0
      - name: Remove stale helper entries from manifest
        shell: bash
        run: |
          set -euo pipefail
          sed -i '\|  \.github/workflows/apply-remaining-localization-v2-20260902.yml$|d' MANIFEST.sha256
          sed -i '\|  \.github/workflows/run-remaining-localization-v2-20260902.yml$|d' MANIFEST.sha256
          ! grep -F 'apply-remaining-localization-v2-20260902.yml' MANIFEST.sha256
          ! grep -F 'run-remaining-localization-v2-20260902.yml' MANIFEST.sha256
      - name: Commit manifest cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MANIFEST.sha256
          git commit -m "Refresh manifest after localization helper cleanup"
          git push origin HEAD:translation/punchier-opening-20260901
