name: Efficiency campaign autofix

on:
  push:
    branches:
      - performance/efficiency-pep8-pep257-20260906

permissions:
  contents: write

concurrency:
  group: efficiency-campaign-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autofix:
    if: ${{ !contains(github.event.head_commit.message, '[campaign-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out campaign branch
        uses: actions/checkout@v4
        with:
          ref: performance/efficiency-pep8-pep257-20260906

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install development tools
        run: python -m pip install -r requirements-dev.txt

      - name: Apply deterministic refactor
        run: python tools/efficiency_autofix.py

      - name: Apply non-autofixable PEP repairs
        run: python tools/efficiency_followup.py

      - name: Write canonical Ruff configuration
        shell: bash
        run: |
          cat > pyproject.toml <<'EOF'
          [tool.ruff]
          line-length = 79
          target-version = "py312"

          [tool.ruff.lint]
          select = ["E", "F", "I", "UP", "W", "D"]
          ignore = ["E501"]

          [tool.ruff.lint.pydocstyle]
          convention = "pep257"

          [tool.mypy]
          python_version = "3.12"
          check_untyped_defs = true
          no_implicit_optional = true
          warn_redundant_casts = true
          warn_unused_configs = true
          warn_unused_ignores = true
          EOF

      - name: Apply safe Ruff fixes and canonical formatting
        run: |
          python -m ruff check --fix nostalgia1907.py tools tests work
          python -m ruff format nostalgia1907.py tools tests work
          python -m ruff check nostalgia1907.py tools tests work

      - name: Regenerate source manifest
        run: python tools/source_manifest.py --root . --write

      - name: Validate transformed tree
        run: python -m tools.source_checks --root . --strict-release

      - name: Commit generated campaign tree
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Optimize repeated scans and enforce PEP standards [campaign-generated]"
          git push origin HEAD:performance/efficiency-pep8-pep257-20260906
