name: Export clean source snapshot

on:
  push:
    paths:
      - '.github/workflows/export-clean-source-20260902.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9575eb180334eb9cdd0d839ac3f619b11eb317bc
          fetch-depth: 1
      - name: Package exact clean source head
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git status --short
          tar --exclude=.git -czf /tmp/nostalgia-1907-source-9575eb1.tgz .
          sha256sum /tmp/nostalgia-1907-source-9575eb1.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: nostalgia-1907-source-9575eb1
          path: /tmp/nostalgia-1907-source-9575eb1.tgz
          if-no-files-found: error
          retention-days: 1
