# Rerun after reviewed ellipsis-style cleanup.
name: Apply reviewed voice passes 20260827

on:
  push:
    branches:
      - translation-source-corrections-20260827
    paths:
      - .github/workflows/fix-source-profile-locks-20260827.yml

permissions:
  contents: write

jobs:
  apply-voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: translation-source-corrections-20260827
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project tooling
        run: python -m pip install -e .
      - name: Apply reviewed voice batches by stable ID
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          sources = Path('work/clean_rebuild/sources')
          review_files = [
              Path('work/reviewed_changes/character_voice_pass_20260827.json'),
              Path('work/reviewed_changes/british_voice_pass_20260827.json'),
          ]

          expected = {}
          for review in review_files:
              payload = json.loads(review.read_text(encoding='utf-8'))
              if set(payload) != {'changes', 'notes'}:
                  raise SystemExit(f'{review}: unexpected top-level keys {sorted(payload)}')
              for stable_id, text in payload['changes'].items():
                  if stable_id in expected:
                      raise SystemExit(f'duplicate reviewed target: {stable_id}')
                  expected[stable_id] = text

          if len(expected) != 50:
              raise SystemExit(f'expected 50 reviewed voice targets, got {len(expected)}')

          by_chapter = {}
          for stable_id, text in expected.items():
              chapter, raw_index = stable_id.split(':', 1)
              if len(raw_index) != 3 or not raw_index.isdigit():
                  raise SystemExit(f'noncanonical stable ID: {stable_id}')
              by_chapter.setdefault(chapter, {})[int(raw_index)] = text

          if set(by_chapter) != {'PART2D', 'PART2E', 'PART2F'}:
              raise SystemExit(f'unexpected chapter set: {sorted(by_chapter)}')

          staged = []
          for chapter, changes in sorted(by_chapter.items()):
              path = sources / f'{chapter}.json'
              data = json.loads(path.read_text(encoding='utf-8'))
              if data.get('chapter') != chapter:
                  raise SystemExit(f'{chapter}: chapter metadata mismatch')
              records = {record['index']: record for record in data['records']}
              if len(records) != len(data['records']):
                  raise SystemExit(f'{chapter}: duplicate record indexes')

              for index, text in sorted(changes.items()):
                  if index not in records:
                      raise SystemExit(f'{chapter}:{index:03d}: missing canonical record')
                  record = records[index]
                  if record.get('policy') != 'translate':
                      raise SystemExit(f'{chapter}:{index:03d}: target is not translatable')
                  record['text'] = text

                  exact = data.get('profile', {}).get('required_text_exact', {})
                  key = str(index)
                  if key in exact:
                      exact[key] = text

              temp = path.with_suffix(path.suffix + '.voice.tmp')
              temp.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              json.loads(temp.read_text(encoding='utf-8'))
              staged.append((path, temp))

          for path, temp in staged:
              os.replace(temp, path)

          failures = []
          cache = {}
          for stable_id, wanted in expected.items():
              chapter, raw_index = stable_id.split(':', 1)
              index = int(raw_index)
              if chapter not in cache:
                  cache[chapter] = json.loads((sources / f'{chapter}.json').read_text(encoding='utf-8'))
              matches = [r for r in cache[chapter]['records'] if r['index'] == index]
              if len(matches) != 1:
                  failures.append(f'{stable_id}: lookup count={len(matches)}')
                  continue
              actual = matches[0].get('text')
              if actual != wanted:
                  failures.append(f'{stable_id}: expected {wanted!r}, got {actual!r}')

          if failures:
              raise SystemExit('\n'.join(failures))
          print(f'PASS: all {len(expected)} reviewed voice targets match canonical sources')
          PY

          changed="$(git diff --name-only -- work/clean_rebuild/sources | sort)"
          expected=$'work/clean_rebuild/sources/PART2D.json\nwork/clean_rebuild/sources/PART2E.json\nwork/clean_rebuild/sources/PART2F.json'
          if [ "$changed" != "$expected" ]; then
            printf 'Unexpected canonical diff set:\n%s\n' "$changed"
            exit 1
          fi
          git diff --check
      - name: Validate source tree
        shell: bash
        run: |
          python tools/source_health.py --root . --strict-release
          python -m compileall -q nostalgia1907.py tools work tests
          python -m unittest discover -s tests -v
      - name: Commit canonical voice changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add work/clean_rebuild/sources/PART2D.json work/clean_rebuild/sources/PART2E.json work/clean_rebuild/sources/PART2F.json
          git commit -m 'translation: apply reviewed character voice passes'
          git push origin HEAD:translation-source-corrections-20260827
