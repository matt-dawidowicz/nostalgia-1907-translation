name: Fix source profile locks 20260827

on:
  push:
    branches:
      - translation-source-corrections-20260827
    paths:
      - .github/workflows/fix-source-profile-locks-20260827.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: translation-source-corrections-20260827
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update stale forbidden heading patterns
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          fixes = {
              "PART1C": (r"(?i)^ACTION\s+1:", r"(?i)^ACT\s+1:"),
              "PART2A": (r"(?i)^ACTION\s+2:", r"(?i)^ACT\s+2:"),
              "PART3A": (r"(?i)Action 3", r"(?i)^ACT\s+3:"),
          }
          for chapter, (old, new) in fixes.items():
              path = Path("work/clean_rebuild/sources") / f"{chapter}.json"
              data = json.loads(path.read_text(encoding="utf-8"))
              patterns = data["profile"]["forbidden_text_patterns"]
              if patterns.count(old) != 1:
                  raise SystemExit(f"{chapter}: expected exactly one stale pattern {old!r}, got {patterns!r}")
              patterns[patterns.index(old)] = new
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
              print(f"{chapter}: {old} -> {new}")
          PY
          git diff --check
      - name: Run profile and source tests
        shell: bash
        run: |
          python -m unittest tests.test_profile_schema -v
          python -m unittest discover -s tests -v
      - name: Commit profile lock updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add work/clean_rebuild/sources/PART1C.json work/clean_rebuild/sources/PART2A.json work/clean_rebuild/sources/PART3A.json
          git commit -m 'translation: align heading guards with source corrections'
          git push origin HEAD:translation-source-corrections-20260827
