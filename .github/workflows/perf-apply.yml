name: Apply performance edits

on:
  push:
    branches:
      - perf/benchmark-and-optimization-20260902

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Apply performance edits
        run: python tools/apply_perf_20260902.py
      - name: Commit performance edits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work/clean_rebuild
          git diff --cached --check
          git commit -m "Optimize LZ and raw rebuild hot paths"
          git push
