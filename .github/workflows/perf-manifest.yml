name: Refresh performance manifest

on:
  push:
    branches:
      - perf/benchmark-and-optimization-20260902

permissions:
  contents: write

jobs:
  manifest:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Regenerate final-tree manifest
        run: |
          python tools/source_manifest.py --root . --write
          grep -vE '  (\.github/workflows/perf-manifest\.yml|tools/perf-manifest-trigger\.txt)$' MANIFEST.sha256 > MANIFEST.sha256.final
          mv MANIFEST.sha256.final MANIFEST.sha256
      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MANIFEST.sha256
          git diff --cached --check
          git commit -m "Refresh performance source manifest"
          git push
