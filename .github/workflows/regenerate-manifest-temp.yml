name: Regenerate manifest temporary

on:
  push:
    branches:
      - refactor/production-architecture-efficiency-20260830

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Render target manifest
        shell: bash
        run: |
          git rm --cached .github/workflows/regenerate-manifest-temp.yml
          rm .github/workflows/regenerate-manifest-temp.yml
          python tools/source_manifest.py --root . --write
          cat MANIFEST.sha256
