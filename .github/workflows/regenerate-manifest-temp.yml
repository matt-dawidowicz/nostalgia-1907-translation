name: Regenerate manifest temporary

on:
  push:
    branches:
      - refactor/production-architecture-efficiency-20260830

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/production-architecture-efficiency-20260830
      - name: Regenerate and commit source manifest
        shell: bash
        run: |
          git rm .github/workflows/regenerate-manifest-temp.yml
          python tools/source_manifest.py --root . --write
          git add MANIFEST.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh source manifest after efficiency refactor"
          git push
