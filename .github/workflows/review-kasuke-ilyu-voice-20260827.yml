name: Review Kasuke Ilyu voice candidates 20260827

on:
  push:
    branches:
      - translation-source-corrections-20260827
    paths:
      - .github/workflows/review-kasuke-ilyu-voice-20260827.yml

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: translation-source-corrections-20260827
      - name: Compare candidates with corrected canon
        shell: bash
        run: |
          python - <<'PY'
          import collections
          import json
          from pathlib import Path

          payload = json.loads(Path('work/reviewed_changes/kasuke_ilyu_voice_candidates_20260827.json').read_text(encoding='utf-8'))
          sources = Path('work/clean_rebuild/sources')
          cache = {}
          results = []

          for item in payload['candidates']:
              chapter, raw_index = item['id'].split(':', 1)
              index = int(raw_index)
              if chapter not in cache:
                  doc = json.loads((sources / f'{chapter}.json').read_text(encoding='utf-8'))
                  cache[chapter] = {r['index']: r for r in doc['records']}
              record = cache[chapter].get(index)
              if record is None:
                  status = 'MISSING'
                  current = None
              else:
                  current = record.get('text')
                  if current == item['before']:
                      status = 'MATCH'
                  elif current == item['after']:
                      status = 'ALREADY_APPLIED'
                  else:
                      status = 'STALE'
              results.append({**item, 'status': status, 'current': current})

          counts = collections.Counter(r['status'] for r in results)
          speaker_matches = collections.Counter(r['speaker'] for r in results if r['status'] == 'MATCH')
          chapter_matches = collections.Counter(r['id'].split(':', 1)[0] for r in results if r['status'] == 'MATCH')
          print('SUMMARY', json.dumps(dict(counts), sort_keys=True))
          print('MATCHES_BY_SPEAKER', json.dumps(dict(speaker_matches), sort_keys=True))
          print('MATCHES_BY_CHAPTER', json.dumps(dict(chapter_matches), sort_keys=True))
          for status in ('STALE', 'ALREADY_APPLIED', 'MISSING'):
              subset = [r for r in results if r['status'] == status]
              print(f'--- {status} ({len(subset)}) ---')
              for r in subset:
                  print(json.dumps({'id': r['id'], 'speaker': r['speaker'], 'before': r['before'], 'after': r['after'], 'current': r['current']}, ensure_ascii=False))

          matches = [r for r in results if r['status'] == 'MATCH']
          print(f'--- MATCH ({len(matches)}) ---')
          for r in matches:
              print(json.dumps({'id': r['id'], 'speaker': r['speaker'], 'after': r['after']}, ensure_ascii=False))

          if counts['MISSING']:
              raise SystemExit('candidate IDs missing from canonical sources')
          PY
