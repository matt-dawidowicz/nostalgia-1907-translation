name: Source checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: python -m pip install -e .

      - name: Audit source-only release tree
        run: python tools/source_health.py --root . --strict-release

      - name: Verify source review manifest
        run: python tools/source_manifest.py --root .

      - name: Compile maintained Python
        run: python -m compileall -q nostalgia1907.py tools tests work

      - name: Run source-only tests
        run: python -m unittest discover -s tests -v

      - name: Audit Python style and documentation
        run: python tools/style_audit.py --root .
