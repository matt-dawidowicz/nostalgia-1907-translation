name: Source checks

on:
  push:
  pull_request:

jobs:
  source-tests:
    strategy:
      matrix:
        include:
          - os: windows-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.10"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install tool
        run: python -m pip install -e .
      - name: Audit source checkout
        run: python tools/source_health.py --root . --strict-release
      - name: Compile tracked Python
        run: python -m compileall -q nostalgia1907.py tools work tests
      - name: Run source-only tests
        run: python -m unittest discover -s tests -v
      - name: Audit maintained source style
        run: python tools/style_audit.py --root .
