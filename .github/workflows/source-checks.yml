name: Source checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.14"

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and development checks
        run: python -m pip install -e ".[dev]"

      - name: Audit source-only release tree
        run: python tools/source_health.py --root . --strict-release

      - name: Verify source review manifest
        run: python tools/source_manifest.py --root .

      - name: Compile maintained Python
        run: python -m compileall -q nostalgia1907.py tools tests work

      - name: Run source-only tests
        run: python -m unittest discover -s tests -v

      - name: Run Ruff lint checks
        run: python -m ruff check nostalgia1907.py tools tests work

      - name: Audit project docstring policy
        run: python tools/style_audit.py --root .
