name: Temp Export Source

on:
  push:
    branches:
      - temp-layout-audit-export-20260904

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Upload source bundle
        uses: actions/upload-artifact@v4
        with:
          name: nostalgia-layout-audit-source
          path: |
            work/
            tests/
            tools/
            docs/
            MANIFEST.sha256
            pyproject.toml
          include-hidden-files: true
          if-no-files-found: error

      - name: Download m68k binutils package
        run: |
          mkdir -p toolbundle
          cd toolbundle
          apt-get download binutils-m68k-linux-gnu

      - name: Upload m68k binutils package
        uses: actions/upload-artifact@v4
        with:
          name: m68k-binutils-deb
          path: toolbundle/*.deb
          if-no-files-found: error
