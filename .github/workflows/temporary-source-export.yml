name: Temporary source export

on:
  push:
    branches:
      - refactor/simplify-project-20260923

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/upload-artifact@v4
        with:
          name: nostalgia1907-source-export
          path: |
            .
            !.git
          include-hidden-files: true
          retention-days: 1
