[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nostalgia1907-tools"
version = "1.0.2"
description = "Operator tooling for the Nostalgia 1907 English translation project"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
dev = [
  "ruff==0.16.5"
]

[project.urls]
Repository = "https://github.com/matt-dawidowicz/nostalgia-1907-translation"
Issues = "https://github.com/matt-dawidowicz/nostalgia-1907-translation/issues"

[project.scripts]
nostalgia1907 = "nostalgia1907:main"

[tool.setuptools]
py-modules = ["nostalgia1907"]
include-package-data = true

[tool.setuptools.packages.find]
include = ["work", "work.*"]

[tool.setuptools.package-data]
"work.clean_rebuild" = ["*.json", "sources/*.json"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "UP"]
