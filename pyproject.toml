[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nostalgia1907-tools"
version = "1.0.0"
description = "Operator tooling for the Nostalgia 1907 English translation project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "tomli>=2.0; python_version < '3.11'"
]

[project.optional-dependencies]
style = [
  "black==24.10.0"
]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.nostalgia1907.style]
line-length = 88
python-version = "3.10"
formatter = "black==24.10.0"

[project.scripts]
nostalgia1907 = "nostalgia1907:main"

[tool.setuptools]
py-modules = ["nostalgia1907"]
