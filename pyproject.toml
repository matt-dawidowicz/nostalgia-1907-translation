[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nostalgia1907-tools"
version = "1.0.2"
description = "Operator tooling for the Nostalgia 1907 English translation project"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
dev = [
  "ruff==0.16.5"
]

[project.urls]
Repository = "https://github.com/matt-dawidowicz/nostalgia-1907-translation"
Issues = "https://github.com/matt-dawidowicz/nostalgia-1907-translation/issues"

[project.scripts]
nostalgia1907 = "nostalgia1907:main"

[tool.setuptools]
py-modules = ["nostalgia1907"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "UP"]

# Avoid source-identity churn in behavior-bearing operator/production modules in
# this maintenance-only pass. Their remaining annotation/import upgrades can be
# handled with retail-backed validation in a production-code change.
[tool.ruff.lint.per-file-ignores]
"nostalgia1907.py" = ["UP035"]
"work/clean_rebuild/scn_layout.py" = ["UP037"]
"work/clean_rebuild/verification_manifest.py" = ["UP035"]
